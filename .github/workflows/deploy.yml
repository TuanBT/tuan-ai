# Đẩy lên production khi có commit mới trên main.
#
# Cần hai secret trong Settings → Secrets and variables → Actions của repo:
#   CLOUDFLARE_API_TOKEN   token tạo ở dash.cloudflare.com, xem README
#   CLOUDFLARE_ACCOUNT_ID  lấy bằng `npx wrangler whoami`
#
# Không có secret Turnstile, OAuth hay SESSION_SECRET ở đây: chúng nằm sẵn trên
# Cloudflare qua `wrangler secret put` và không bị lần deploy nào ghi đè.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Cho phép bấm "Run workflow" ngay trên GitHub khi muốn deploy lại mà không
  # phải tạo commit rỗng.
  workflow_dispatch:

# Hai lần deploy chồng nhau là hỏng. `cancel-in-progress: false` vì huỷ giữa
# chừng còn tệ hơn: migration có thể đã chạy mà code thì chưa lên.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Wrangler đòi Node 22 trở lên.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + test + lint + build. Không gọi tới Cloudflare nên nhánh phụ
      # và pull request cũng chạy được mà không cần token.
      - name: Kiểm tra
        run: npm run verify

      # Từ đây trở xuống chỉ chạy khi commit đã nằm trên main. Pull request dừng
      # ở bước kiểm tra phía trên.
      - name: Chạy migration D1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply tuan-ai-db --remote

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
